# PR preview environments on AWS ECS (SKY-164). Each pull request from a
# branch of this repository gets its own copy of the app in the staging
# cluster:
#   https://pr-<n>.staging.skynetml.com      frontend
#   https://api-pr-<n>.staging.skynetml.com  backend
# A push updates the preview; closing the PR deletes it. At most 4 previews
# run at once. A PR that finds no free slot gets a comment; add the label
# "preview" to try again. preview-cleanup.yml deletes previews that got no
# push for 48 hours.
#
# Fork PRs, Dependabot PRs and staging -> main promotion PRs get no preview:
# the job does not run for them, and GitHub gives fork runs no OIDC token.
# A PR whose files cannot change the running app (docs, droid-wiki/,
# tools/reel-skynet/, tests, .github/ except the preview workflows) gets no
# preview either, unless it has the label "preview".
#
# Auth: GitHub OIDC -> skynet-github-deploy-preview (infra/terraform/global),
# which trusts only the GitHub environment aws-preview. That environment must
# allow deployments from every branch.
#
# Configuration (Settings > Environments > aws-preview > variables):
#   vars.AWS_DEPLOY_ROLE_ARN                     github_preview_role_arn
#   vars.NEXT_PUBLIC_SENTRY_DSN, vars.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE
#                                                (optional)
name: preview

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, closed]

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: us-east-2
  PR: ${{ github.event.pull_request.number }}
  SHA: ${{ github.event.pull_request.head.sha }}
  APP_URL: https://pr-${{ github.event.pull_request.number }}.staging.skynetml.com
  API_URL: https://api-pr-${{ github.event.pull_request.number }}.staging.skynetml.com

jobs:
  deploy:
    if: >-
      github.event.action != 'closed'
      && github.event.pull_request.state == 'open'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref != 'staging'
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    environment: aws-preview
    # Per job, not per workflow: a run for another label skips this job, and
    # at workflow level it would still replace a pending deploy in the queue.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # Uses the API, so it runs before the checkout and the AWS login.
      - name: Check that the PR can change the running app
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          FORCED: ${{ contains(github.event.pull_request.labels.*.name, 'preview') }}
        run: |
          # A PR branched before the preview scripts reached its base has no
          # scripts at its head. The base scripts would deploy the wrong code.
          if ! err=$(gh api "repos/$GITHUB_REPOSITORY/contents/infra/terraform/scripts/preview.sh?ref=$SHA" --silent 2>&1); then
            case "$err" in
              *"HTTP 404"*)
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "::notice::The PR head has no infra/terraform/scripts/preview.sh. Rebase onto staging to get a preview."
                exit 0 ;;
              *) echo "$err" >&2; exit 1 ;;
            esac
          fi
          if [ "$FORCED" = true ]; then
            echo "The label preview asks for a preview."
            exit 0
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > "$RUNNER_TEMP/files.txt"
          # A file can change the app unless it matches a case below. *.md
          # inside backend/ and frontend/ can be app content (agent prompts).
          app=""
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/preview.yml | .github/workflows/preview-cleanup.yml) ;;
              .github/* | droid-wiki/* | tools/reel-skynet/* | backend/tests/* | backend/load_tests/*) continue ;;
              */tests/* | */__tests__/* | *.test.ts | *.test.tsx | *.spec.ts | *.spec.tsx) continue ;;
              backend/* | frontend/*) ;;
              *.md) continue ;;
            esac
            app="$f"
            break
          done < "$RUNNER_TEMP/files.txt"
          if [ -z "$app" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No changed file can change the running app; no preview. Add the label preview to get one."
          else
            echo "$app can change the app"
          fi

      - uses: actions/checkout@v4
        if: steps.scope.outputs.skip != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.scope.outputs.skip != 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Claim a preview slot
        id: claim
        if: steps.scope.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          infra/terraform/scripts/preview.sh claim "$PR" "$SHA"
          code=$?
          set -e
          if [ "$code" = 3 ]; then
            infra/terraform/scripts/preview-comment.sh "$PR" "**Preview skipped.** All 4 preview slots are in use. When a slot is free, push a commit or add the label \`preview\` (remove it first if it is there) to try again."
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - uses: docker/setup-buildx-action@v3
        if: steps.scope.outputs.skip != 'true' && steps.claim.outputs.full != 'true'

      - name: Build and push the preview images
        if: steps.scope.outputs.skip != 'true' && steps.claim.outputs.full != 'true'
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE }}
        run: infra/terraform/scripts/preview.sh build "$PR" "$SHA"

      # The preview role allows one-hour sessions; a cold build can use most
      # of that hour.
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.scope.outputs.skip != 'true' && steps.claim.outputs.full != 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Deploy the preview
        if: steps.scope.outputs.skip != 'true' && steps.claim.outputs.full != 'true'
        run: infra/terraform/scripts/preview.sh deploy "$PR" "$SHA"

      - name: Wait for the preview to serve this commit
        if: steps.scope.outputs.skip != 'true' && steps.claim.outputs.full != 'true'
        run: |
          fetch() { curl -sS -L --max-time 20 "$@" 2>/dev/null; }
          deadline=$(( $(date +%s) + 10 * 60 ))
          while :; do
            backend=$(fetch -f "$API_URL/health" | jq -r '.commit // empty' 2>/dev/null) || backend=""
            frontend=$(fetch -f "$APP_URL/api/version" | jq -r '.commit // empty' 2>/dev/null) || frontend=""
            if [ "$backend" = "$SHA" ] && [ "$frontend" = "$SHA" ]; then
              break
            fi
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "::error::The preview did not serve ${SHA:0:8} in 10 minutes. Backend serves ${backend:-nothing}, frontend serves ${frontend:-nothing}."
              exit 1
            fi
            echo "Waiting: backend ${backend:0:8}, frontend ${frontend:0:8}"
            sleep 15
          done
          echo "Preview is live: $APP_URL"

      - name: Comment the preview links
        if: steps.scope.outputs.skip != 'true' && steps.claim.outputs.full != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          infra/terraform/scripts/preview-comment.sh "$PR" "**Preview is live** for \`${SHA:0:8}\`.

          - App: $APP_URL
          - API: $API_URL/health

          It updates on every push and is deleted when the PR closes or after 48 hours without a push."

      - name: Comment the failure
        if: failure() && steps.scope.outputs.skip != 'true' && steps.claim.outputs.full != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: infra/terraform/scripts/preview-comment.sh "$PR" "**Preview failed** for \`${SHA:0:8}\`. See $RUN_URL"

  # Runs for every closed PR from this repository, also when the deploy job
  # skipped it: a PR's files can change after its preview started.
  delete:
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref != 'staging'
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment: aws-preview
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # The base branch scripts: they are the newest, so they delete every
      # resource a preview can have. The base branch can lack them (the PR
      # that adds them); then the PR head scripts delete the preview. GitHub
      # keeps the head commit in refs/pull/<n>/head after the head branch is
      # deleted.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - uses: actions/checkout@v4
        if: hashFiles('infra/terraform/scripts/preview.sh') == ''
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Delete the preview
        run: infra/terraform/scripts/preview.sh delete "$PR"

      - name: Update the comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: infra/terraform/scripts/preview-comment.sh "$PR" "**Preview deleted** (the PR closed)." --update-only
