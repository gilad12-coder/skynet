name: cla

# pull_request_target so the check can comment on and record signatures for
# pull requests from forks. It never checks out the pull request's code, so
# the elevated token cannot run untrusted code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor License Agreement
    if: >-
      (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
      github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      # Pinned to the v2.6.1 commit: this step holds a write token.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          # Signatures live on their own branch because main is protected.
          branch: cla-signatures
          allowlist: gilad12-coder,hexdrift,dependabot[bot],*[bot]
