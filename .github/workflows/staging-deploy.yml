# Confirms that a push to the staging branch actually reached the staging
# environment. Railway deploys staging on its own; this run waits until the
# staging backend and frontend serve a commit that includes every change to
# their folders, then writes the links into the run summary. A red run means
# staging did not come up with your change, so look at the Railway logs.
#
# Optional configuration (Settings > Secrets and variables > Actions):
#   vars.STAGING_APP_URL   default https://frontend-staging-102e.up.railway.app
#   vars.STAGING_API_URL   default https://backend-staging-6295.up.railway.app
name: staging deploy

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The aws deploy run of this commit can wait behind the previous one, and
    # each run may take up to 90 minutes.
    timeout-minutes: 150
    env:
      APP_URL: ${{ vars.STAGING_APP_URL || 'https://frontend-staging-102e.up.railway.app' }}
      API_URL: ${{ vars.STAGING_API_URL || 'https://backend-staging-6295.up.railway.app' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Wait for the aws deploy run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Poll the served commit only after its deploy finished, so a deploy
          # that waits in the aws deploy queue does not use up the poll time.
          deadline=$(( $(date +%s) + 110 * 60 ))
          while :; do
            # The runs API, not `gh run list --workflow`: that looks the
            # workflow up on main, which does not have aws-deploy.yml.
            # Push and manual runs count: a manual staging deploy can cancel
            # the queued push run of this commit and deploy it instead.
            # shellcheck disable=SC2016 # $r is a jq variable.
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&branch=staging&per_page=100" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/aws-deploy.yml")] as $r
                | if any($r[]; .conclusion == "success") then {status: "success", url: (first($r[] | select(.conclusion == "success")) | .html_url)}
                  elif any($r[]; .status != "completed") then {status: (first($r[] | select(.status != "completed")) | .status)}
                  elif ($r | length) == 0 then {}
                  else ($r | map(select(.conclusion != "cancelled")) + $r)[0] | {status: .conclusion, url: .html_url} end') || run=
            status=$(jq -r '.status // empty' <<<"$run")
            url=$(jq -r '.url // empty' <<<"$run")
            if [ "$status" = "success" ]; then
              echo "aws deploy succeeded: $url"
              break
            fi
            case "$status" in
              "" | queued | in_progress | waiting | requested | pending) ;;
              *)
                echo "::error::The aws deploy runs of ${GITHUB_SHA:0:8} ended with $status: $url"
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "::error::The aws deploy run of ${GITHUB_SHA:0:8} did not finish in 110 minutes (status: ${status:-not found})."
              exit 1
            fi
            echo "Waiting for aws deploy: ${status:-not started}"
            sleep 30
          done
      - name: Wait for staging to serve this push
        run: |
          fetch() { curl -sS -L --max-time 20 "$@" 2>/dev/null; }

          # Railway only rebuilds a service when its own folder changed, so a
          # service is current once no change to its folder sits after the
          # commit it serves.
          current() {
            local commit=$1 dir=$2
            [ -n "$commit" ] && git cat-file -e "$commit^{commit}" 2>/dev/null \
              && [ -z "$(git log --format=%H "$commit..HEAD" -- "$dir" | head -1)" ]
          }

          deadline=$(( $(date +%s) + 35 * 60 ))
          while :; do
            health=$(fetch -f "$API_URL/health") || health=""
            backend=$(jq -r '.commit // empty' <<<"$health" 2>/dev/null)
            version=$(fetch -f "$APP_URL/api/version") || version=""
            frontend=$(jq -r '.commit // empty' <<<"$version" 2>/dev/null)
            if current "$backend" backend/ && current "$frontend" frontend/; then
              break
            fi
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "::error::Staging did not pick up ${GITHUB_SHA:0:8} in 35 minutes. Backend serves ${backend:-nothing}, frontend serves ${frontend:-nothing}. Check the staging deploy logs on Railway."
              exit 1
            fi
            echo "Waiting: backend ${backend:0:8}, frontend ${frontend:0:8}"
            sleep 30
          done

          {
            echo "### Staging is live with ${GITHUB_SHA:0:8}"
            echo
            echo "- App: $APP_URL"
            echo "- API: $API_URL/health"
            echo "- Backend serves \`${backend:0:8}\`, frontend serves \`${frontend:0:8}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Staging is live: $APP_URL"
