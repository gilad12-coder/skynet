# Deletes PR previews (SKY-164) whose PR is no longer open, or that got no
# push for 48 hours. A push or the label "preview" brings a preview back.
# GitHub runs schedules only from the default branch, so this runs once the
# file is on main.
#
# Each delete runs in the concurrency group of its PR, like preview.yml, so it
# never overlaps a deploy of the same PR. The prune job then deletes the task
# definitions of PRs that hold no slot. Its role trusts only main, because it
# may deregister task definitions, and IAM cannot scope that by family.
name: preview cleanup

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: preview-cleanup
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    environment: aws-preview
    env:
      AWS_REGION: us-east-2
      GH_TOKEN: ${{ github.token }}
    outputs:
      stale: ${{ steps.plan.outputs.stale }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Find stale previews
        id: plan
        run: |
          now=$(date +%s)
          infra/terraform/scripts/preview.sh list > slots.txt
          stale='[]'
          # fd 3, so the commands in the loop cannot read the list from stdin.
          while read -r pr sha at <&3; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .state) || state=unknown
            age=$(( (now - at) / 3600 ))
            if [ "$state" = unknown ]; then
              echo "PR $pr: cannot read the PR state; keep"
            elif [ "$state" = open ] && [ "$age" -lt 48 ]; then
              echo "PR $pr: keep (${sha:0:8}, ${age} h since the last push)"
            else
              echo "PR $pr: delete ($state, ${age} h since the last push)"
              stale=$(jq -c --argjson pr "$pr" --argjson at "$at" --arg state "$state" '. + [{pr: $pr, at: $at, state: $state}]' <<<"$stale")
            fi
          done 3< slots.txt
          echo "stale=$stale" >> "$GITHUB_OUTPUT"

  delete:
    needs: plan
    if: needs.plan.outputs.stale != '[]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment: aws-preview
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.stale) }}
    concurrency:
      group: preview-${{ matrix.pr }}
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-2
      GH_TOKEN: ${{ github.token }}
      PR: ${{ matrix.pr }}
      PLANNED_AT: ${{ matrix.at }}
      PR_STATE: ${{ matrix.state }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      # A deploy of the PR may have run while this job waited for the group.
      - name: Delete the preview
        run: |
          at=$(infra/terraform/scripts/preview.sh list | awk -v pr="$PR" '$1 == pr { print $3 }')
          if [ "$at" != "$PLANNED_AT" ]; then
            echo "PR $PR: the slot changed since the plan; keep"
            exit 0
          fi
          infra/terraform/scripts/preview.sh delete "$PR"
          if [ "$PR_STATE" = open ]; then
            infra/terraform/scripts/preview-comment.sh "$PR" "**Preview deleted** after 48 hours without a push. Push a commit, or add the label \`preview\` (remove it first if it is there), to bring it back."
          else
            infra/terraform/scripts/preview-comment.sh "$PR" "**Preview deleted** (the PR closed)." --update-only
          fi

  prune:
    needs: [plan, delete]
    if: always() && needs.plan.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      AWS_REGION: us-east-2
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # No GitHub environment: the OIDC subject is then the branch ref, and
      # the cleanup role trusts only refs/heads/main.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_CLEANUP_ROLE_ARN }}
          aws-region: us-east-2

      - name: Delete the task definitions of deleted previews
        run: |
          infra/terraform/scripts/preview.sh revision-prs > prs.txt
          failed=0
          while read -r pr <&3; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .state) || state=unknown
            if [ "$state" != closed ]; then
              echo "PR $pr: $state; keep its task definitions"
              continue
            fi
            # prune keeps the revisions when the PR holds a slot.
            if ! infra/terraform/scripts/preview.sh prune "$pr"; then
              echo "::error::Could not delete the task definitions of PR $pr"
              failed=1
            fi
          done 3< prs.txt
          exit "$failed"
