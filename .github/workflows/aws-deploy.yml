# Builds the arm64 images and deploys one commit to AWS ECS (SKY-156; it also
# covers the deploy part of SKY-162).
# A push to staging deploys that commit to staging. A push never deploys
# production; production runs only from workflow_dispatch.
# Needs the global stack applied first (it creates the OIDC provider and the
# roles).
# Auth: GitHub OIDC -> one role per environment (infra/terraform/global). No
# static AWS keys. skynet-github-deploy-staging trusts only the GitHub
# environment aws-staging and reaches only staging resources;
# skynet-github-deploy-production trusts only aws-production and reaches only
# production resources. Restrict aws-staging to the staging branch and
# aws-production to main with required reviewers (see infra/terraform/README.md).
#
# Configuration (Settings > Environments > aws-<env> > variables and secrets):
#   vars.AWS_DEPLOY_ROLE_ARN                     github_deploy_role_arns[<env>]
#   vars.NEXT_PUBLIC_SENTRY_DSN, vars.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE
#                                                (optional)
name: aws deploy

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

# On push, inputs is empty, so the target is staging. A newer push waits for
# the running deploy and replaces any older push that still waits.
concurrency:
  group: aws-deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # Native arm64 runner: the images run on Graviton Fargate tasks.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    environment: aws-${{ inputs.environment || 'staging' }}
    env:
      AWS_REGION: us-east-2
      DEPLOY_ENV: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push images
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE }}
        run: infra/terraform/scripts/build-push.sh "$DEPLOY_ENV" "$GITHUB_SHA"

      # The deploy role allows one-hour sessions. A cold build can use most of
      # that hour, so get fresh credentials before the migration and the wait.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Migrate and deploy
        run: infra/terraform/scripts/deploy.sh "$DEPLOY_ENV" "$GITHUB_SHA"
