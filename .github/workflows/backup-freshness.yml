# Alerts when production's pgBackRest repository stops receiving backups or
# WAL. Railway runs the backups but nothing alerts when they stop. Like the
# uptime monitor, a failed run is the alert: GitHub emails the workflow's owner,
# and ALERT_WEBHOOK_URL gets the same message when set.
#
# Configuration (Settings > Secrets and variables > Actions), copied from the
# Postgres service's WAL_ARCHIVE_* variables on Railway:
#   secrets.BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET, BACKUP_S3_KEY_ID, BACKUP_S3_SECRET
#   vars.BACKUP_S3_REGION      default empty
#   vars.BACKUP_S3_PATH        default pgbackrest
#   vars.BACKUP_MAX_AGE_HOURS  default 26 (backups run daily)
#   vars.WAL_MAX_AGE_MINUTES   default 60
# Unset secrets skip the check with a warning instead of failing.
name: backup freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

concurrency:
  group: backup-freshness
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
      BACKUP_S3_SECRET: ${{ secrets.BACKUP_S3_SECRET }}
      BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
      BACKUP_S3_PATH: ${{ vars.BACKUP_S3_PATH || 'pgbackrest' }}
      BACKUP_MAX_AGE_HOURS: ${{ vars.BACKUP_MAX_AGE_HOURS || '26' }}
      WAL_MAX_AGE_MINUTES: ${{ vars.WAL_MAX_AGE_MINUTES || '60' }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/check_backup_freshness.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check backup and WAL freshness
        run: |
          if [ -z "$BACKUP_S3_ENDPOINT" ] || [ -z "$BACKUP_S3_BUCKET" ] || [ -z "$BACKUP_S3_KEY_ID" ] || [ -z "$BACKUP_S3_SECRET" ]; then
            echo "::warning::BACKUP_S3_* secrets are not set; skipping the backup freshness check"
            exit 0
          fi
          pip install --quiet boto3
          if output=$(python scripts/check_backup_freshness.py 2>&1); then
            echo "$output"
            exit 0
          fi
          echo "$output"
          message="Skynet backups: $(grep '^PROBLEM' <<<"$output" | sed 's/^PROBLEM: //' | paste -sd ';' -)"
          [ "$message" = "Skynet backups: " ] && message="Skynet backups: the freshness check crashed"
          echo "::error::$message"
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            jq -n --arg text "$message ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{text: $text}' \
              | curl -sS --max-time 10 -H 'Content-Type: application/json' -d @- "$ALERT_WEBHOOK_URL" >/dev/null || true
          fi
          exit 1
